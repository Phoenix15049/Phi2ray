[package]
name = "phi2ray"
version = "0.1.0"
description = "A small, careful Xray client for Windows: VPN mode, kill switch, split tunnelling and subscriptions."
authors = ["M.R. Yadollahi"]
license = "MIT"
repository = "https://github.com/YOUR_GITHUB_USERNAME/Phi2ray"
homepage = "https://github.com/YOUR_GITHUB_USERNAME/Phi2ray"
readme = "../README.md"
keywords = ["xray", "vless", "vpn", "proxy", "tauri"]
edition = "2021"

[lib]
name = "phi2ray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Pack xray, sing-box and their data files into the exe (single-file release).
embed-cores = ["dep:zstd"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"
hex = "0.4"
zstd = "0.13"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"
percent-encoding = "2"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["net", "time", "process", "sync", "io-util"] }
# Subscriptions only. native-tls uses Windows' own TLS (SChannel), so no extra crypto is bundled.
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "gzip"] }
zstd = { version = "0.13", optional = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_Networking_WinInet",
  "Win32_NetworkManagement_WindowsFilteringPlatform",
  "Win32_System_Rpc",
  "Win32_System_SystemInformation",
  "Win32_System_JobObjects",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Build scripts (which compress the embedded cores) run optimized, or packing takes minutes.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3
