[package]
name = "phi2ray"
version = "0.2.1"
description = "A small, careful Xray client for Windows and Linux: VPN mode, kill switch, split tunnelling and subscriptions."
authors = ["M.R. Yadollahi"]
license = "MIT"
repository = "https://github.com/Phoenix15049/Phi2ray"
homepage = "https://github.com/Phoenix15049/Phi2ray"
readme = "../README.md"
keywords = ["xray", "vless", "vpn", "proxy", "tauri"]
edition = "2021"

[lib]
name = "phi2ray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Pack xray, sing-box and their data files into the exe (single-file release).
embed-cores = ["dep:zstd"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"
hex = "0.4"
# Only plain frames are packed and unpacked: no legacy format, no dictionaries.
zstd = { version = "0.14.3", default-features = false }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"
percent-encoding = "2"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["net", "time", "process", "sync", "io-util"] }
zstd = { version = "0.14.3", default-features = false, optional = true }

# Subscriptions and lookups. native-tls uses Windows' own TLS (SChannel), so no extra crypto is
# bundled there. On Linux rustls with the system's certificates avoids depending on one OpenSSL
# version, which differs from one distribution to the next.
[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "gzip"] }
libc = "0.2"
chacha20poly1305 = "0.10"
secret-service = { version = "5", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "gzip"] }
winreg = "0.52"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_Networking_WinInet",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_WindowsFilteringPlatform",
  "Win32_Networking_WinSock",
  "Win32_Storage_FileSystem",
  "Win32_System_Rpc",
  "Win32_System_SystemInformation",
  "Win32_System_JobObjects",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Build scripts (which compress the embedded cores) run optimized, or packing takes minutes.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3
