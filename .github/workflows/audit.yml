# Checks the locked Rust and npm dependencies against the public advisory databases.
# Runs on every push and pull request, and once a week so new advisories show up too.
# Actions are pinned to exact commits (the tag is noted after each), so a changed upstream tag
# can't change what runs here.
name: Dependency audit

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Cargo.lock
        run: cargo audit --file src-tauri/Cargo.lock
      - name: Audit the console tool's Cargo.lock
        run: cargo audit --file src-tauri/cli/Cargo.lock

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      # What ships in the app. A high-severity advisory here fails the run.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      # Build tools (Vite, esbuild and friends) never reach the exe, but they run on the machine
      # that builds it. Reported here without failing the run.
      - name: Audit development dependencies
        continue-on-error: true
        run: npm audit --audit-level=moderate
