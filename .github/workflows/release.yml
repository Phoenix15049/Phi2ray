# Builds every release file on GitHub from a version tag, so each can be traced back to its exact
# commit and build, and publishes them as a draft release with their SHA-256:
# the Windows exe, and for Linux a .deb, .rpm, Arch package and AppImage.
#
# - Push a tag like `v0.2.0` (matching the version in tauri.conf.json) to build and draft a release.
# - Or run it by hand (Actions → Release → Run workflow) to build without releasing; the files are
#   kept as workflow artifacts.
#
# Nothing ships if a dependency audit fails or a downloaded core doesn't match its pinned hash in
# src-tauri/core. Actions are pinned to exact commits (tag noted after each).
#
# Tagged releases are signed through SignPath once the repository has the variables
# SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG and SIGNPATH_POLICY_SLUG and the secret
# SIGNPATH_API_TOKEN. Publishing unsigned requires ALLOW_UNSIGNED_WINDOWS_RELEASE=true.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Must match the files pinned in src-tauri/core/SHA256SUMS and SHA256SUMS.linux.
  XRAY_VERSION: "26.10.21"
  SING_BOX_VERSION: "1.14.4"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check release versions and tag
        run: node scripts/check-release-version.mjs

      - name: Check Windows signing policy
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          ORGANIZATION: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          POLICY: ${{ vars.SIGNPATH_POLICY_SLUG }}
          SIGNING_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ALLOW_UNSIGNED: ${{ vars.ALLOW_UNSIGNED_WINDOWS_RELEASE }}
        run: |
          if [ -n "$PROJECT$ORGANIZATION$POLICY" ]; then
            if [ -z "$PROJECT" ] || [ -z "$ORGANIZATION" ] || [ -z "$POLICY" ] || [ -z "$SIGNING_TOKEN" ]; then
              echo "::error::Incomplete SignPath configuration. Configure all three variables and the API token secret."
              exit 1
            fi
          elif [ "$ALLOW_UNSIGNED" != "true" ]; then
            echo "::error::Configure SignPath or explicitly set ALLOW_UNSIGNED_WINDOWS_RELEASE=true for an unsigned release."
            exit 1
          fi

      - name: Audit dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file src-tauri/Cargo.lock
          cargo audit --file src-tauri/cli/Cargo.lock
          cargo audit --file src-tauri/helper/Cargo.lock
          npm audit --omit=dev --audit-level=high

  windows:
    needs: checks
    runs-on: windows-latest
    permissions:
      actions: read # SignPath reads the unsigned artifact
      contents: read
    outputs:
      signed: ${{ steps.final.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download and check the cores
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP cores
          New-Item -ItemType Directory $tmp | Out-Null
          $download = @{ MaximumRetryCount = 3; RetryIntervalSec = 2; TimeoutSec = 120 }
          Invoke-WebRequest "https://github.com/XTLS/Xray-core/releases/download/v$env:XRAY_VERSION/Xray-windows-64.zip" -OutFile "$tmp/xray.zip" @download
          Invoke-WebRequest "https://github.com/SagerNet/sing-box/releases/download/v$env:SING_BOX_VERSION/sing-box-$env:SING_BOX_VERSION-windows-amd64.zip" -OutFile "$tmp/sing-box.zip" @download
          foreach ($archive in @("xray", "sing-box")) {
            $names = if ($archive -eq 'xray') { @('xray.exe', 'geoip.dat', 'geosite.dat') } else { @('sing-box.exe', 'libcronet.dll') }
            $zip = [IO.Compression.ZipFile]::OpenRead("$tmp/$archive.zip")
            try {
              foreach ($name in $names) {
                $entries = @($zip.Entries | Where-Object { $_.Name -ceq $name })
                if ($entries.Count -ne 1 -or $entries[0].Length -le 0 -or $entries[0].Length -gt 256MB) {
                  throw "$archive archive must contain exactly one expected $name of a valid size."
                }
                [IO.Compression.ZipFileExtensions]::ExtractToFile($entries[0], (Join-Path $tmp $name))
              }
            } finally { $zip.Dispose() }
          }
          # The build itself refuses any file that doesn't match; this just says which one.
          foreach ($line in Get-Content src-tauri/core/SHA256SUMS) {
            $hash, $name = $line -split '\s+', 2
            $name = $name.TrimStart('*')
            $actual = (Get-FileHash "$tmp/$name" -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $hash) { throw "$name has SHA-256 $actual, but SHA256SUMS pins $hash." }
            "$name OK"
          }
          foreach ($line in Get-Content src-tauri/core/SHA256SUMS) {
            $name = ($line -split '\s+', 2)[1].TrimStart('*')
            Copy-Item -LiteralPath "$tmp/$name" -Destination src-tauri/core/
          }

      - name: Build
        run: |
          npm ci --no-audit
          npm run build:exe

      - name: Name the exe
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $name = "Phi2ray-$version-windows-x64.exe"
          New-Item -ItemType Directory unsigned, release | Out-Null
          Copy-Item src-tauri/target/release/phi2ray.exe "unsigned/$name"
          "APP_VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "EXE_NAME=$name" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      # Each signing request waits for manual approval on SignPath, so hand-started test builds
      # stay unsigned.
      - name: Upload the unsigned exe
        id: unsigned
        if: github.event_name == 'push' && github.ref_type == 'tag' && vars.SIGNPATH_PROJECT_SLUG != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-windows-exe
          path: unsigned/
          if-no-files-found: error

      - name: Sign the exe
        if: github.event_name == 'push' && github.ref_type == 'tag' && vars.SIGNPATH_PROJECT_SLUG != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Time to approve the request on SignPath.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: release
          parameters: |
            version: ${{ toJSON(env.APP_VERSION) }}

      - name: Check the signature
        id: final
        shell: pwsh
        env:
          SIGNING_REQUIRED: ${{ github.event_name == 'push' && github.ref_type == 'tag' && vars.SIGNPATH_PROJECT_SLUG != '' }}
        run: |
          $exe = "release/$env:EXE_NAME"
          $signed = $env:SIGNING_REQUIRED -eq 'true'
          if ($signed) {
            if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw "SignPath did not return the expected executable." }
            $signature = Get-AuthenticodeSignature $exe
            if ($signature.Status -ne 'Valid' -or !$signature.SignerCertificate -or !$signature.TimeStamperCertificate) {
              throw "The executable needs a valid, timestamped Authenticode signature: $($signature.StatusMessage)"
            }
          } else {
            Copy-Item "unsigned/$env:EXE_NAME" $exe
          }
          "signed=$($signed.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && 'phi2ray-windows-x64-test-unsigned' || 'phi2ray-windows-x64' }}
          path: release/
          if-no-files-found: error

  linux:
    needs: checks
    # The oldest supported Ubuntu: what's built here also runs on anything newer.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      deb_sha256: ${{ steps.packages.outputs.deb_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf libfuse2 file rpm unzip curl

      - name: Download and check the cores
        run: sh scripts/get-linux-cores.sh

      - name: Build
        env:
          # linuxdeploy's own strip can't read some newer libraries.
          NO_STRIP: "true"
        run: |
          npm ci --no-audit
          npm run build:linux

      - name: Name the packages
        id: packages
        run: |
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          bundle=src-tauri/target/release/bundle
          mkdir release
          cp "$bundle"/deb/*.deb "release/Phi2ray-$version-linux-amd64.deb"
          cp "$bundle"/rpm/*.rpm "release/Phi2ray-$version-linux-x86_64.rpm"
          cp "$bundle"/appimage/*.AppImage "release/Phi2ray-$version-linux-x86_64.AppImage"
          chmod +x release/*.AppImage
          digest="$(sha256sum -- "release/Phi2ray-$version-linux-amd64.deb")"
          echo "deb_sha256=${digest%% *}" >> "$GITHUB_OUTPUT"

      # VPN mode depends on these: the helper refuses a folder anyone but root can change.
      - name: Check what's inside the packages
        run: |
          for file in usr/bin/phi2ray usr/bin/phi2ray-app usr/lib/phi2ray/phi2ray-helper usr/lib/phi2ray/xray \
                      usr/lib/phi2ray/sing-box usr/lib/phi2ray/geoip.dat usr/share/polkit-1/actions/com.phi2ray.helper.policy; do
            # Tauri writes paths without the usual leading "./".
            dpkg-deb -c release/*.deb | grep -Eq "[[:space:]](\./)?$file\$" || { echo "$file is missing from the .deb"; exit 1; }
            rpm -qlp release/*.rpm | grep -q "^/$file\$" || { echo "$file is missing from the .rpm"; exit 1; }
          done
          if dpkg-deb -c release/*.deb | awk '{print $2}' | grep -vE '^(root/root|0/0)$'; then
            echo "Everything in the .deb must belong to root."
            exit 1
          fi
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE"/release/*.AppImage --appimage-extract >/dev/null
          for file in usr/bin/phi2ray usr/lib/phi2ray/xray usr/lib/phi2ray/sing-box usr/lib/phi2ray/libcronet.so usr/lib/phi2ray/geoip.dat usr/lib/phi2ray/geosite.dat; do
            [ -f "squashfs-root/$file" ] || { echo "$file is missing from the AppImage"; exit 1; }
          done
          # linuxdeploy rewrites programs it finds in the AppImage; these must still start.
          squashfs-root/usr/lib/phi2ray/xray version
          squashfs-root/usr/lib/phi2ray/sing-box version
          test ! -e squashfs-root/usr/lib/phi2ray/phi2ray-helper
          test ! -e squashfs-root/usr/lib/phi2ray/com.phi2ray.helper.policy

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phi2ray-linux-x64
          path: release/
          if-no-files-found: error

      - name: Keep the .deb as a file of its own
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: release/*.deb
          archive: false

      - name: Keep the .rpm as a file of its own
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: release/*.rpm
          archive: false

      - name: Keep the AppImage as a file of its own
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: release/*.AppImage
          archive: false

  # Repackages the tested .deb and verifies its digest before extraction.
  arch:
    needs: linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phi2ray-linux-x64
          path: linux
      - name: Build the package
        env:
          PHI2RAY_DEB_SHA256: ${{ needs.linux.outputs.deb_sha256 }}
        run: |
          printf '%s\n' "$PHI2RAY_DEB_SHA256" | grep -Eq '^[[:xdigit:]]{64}$'
          pacman -Syu --noconfirm --needed base-devel
          useradd --create-home builder
          mkdir build
          cp packaging/arch/* build/
          cp linux/*.deb build/
          chown -R builder build
          cd build
          su builder -c 'PHI2RAY_DEB_SHA256="$1" makepkg --nodeps --noconfirm' sh "$PHI2RAY_DEB_SHA256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phi2ray-arch-x64
          path: build/*.pkg.tar.zst
          if-no-files-found: error

      - name: Keep the package as a file of its own
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/*.pkg.tar.zst
          archive: false

  publish:
    needs: [windows, linux, arch]
    if: ${{ success() && github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # draft release
      id-token: write # build attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: phi2ray-*-x64
          path: release
          merge-multiple: true

      - name: Hash the files
        run: |
          cd release
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS.txt"
          mv "$RUNNER_TEMP/SHA256SUMS.txt" SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Signed proof that these files came from this repository, commit and workflow. GitHub offers
      # it for public repositories (private ones need GitHub Enterprise).
      - name: Attest the build
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      - name: Draft the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ATTESTED: ${{ github.event.repository.visibility == 'public' }}
          SIGNED: ${{ needs.windows.outputs.signed }}
        run: |
          commit="$(git rev-parse HEAD)"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          changes="$(awk -v heading="## What's new in ${TAG#v}" '$0 == heading { section=1; next } /^## / && section { exit } section { print }' README.md)"
          {
            echo "Built by GitHub Actions from commit $commit."
            echo
            if [ -n "$changes" ]; then
              echo "## What's new"
              printf '%s\n\n' "$changes"
            fi
            echo "Download only the file for your system:"
            echo
            echo "| Your system | File |"
            echo "|---|---|"
            for file in release/*; do
              name="$(basename "$file")"
              case "$name" in
                *.exe) echo "| Windows 10 and 11 | [\`$name\`]($base/$name) |" ;;
                *.deb) echo "| Ubuntu, Debian, Linux Mint, Pop!_OS, Zorin, Kali | [\`$name\`]($base/$name) |" ;;
                *.rpm) echo "| Fedora, RHEL, AlmaLinux, Rocky | [\`$name\`]($base/$name) |" ;;
                *.pkg.tar.zst) echo "| Arch, Manjaro, EndeavourOS | [\`$name\`]($base/$name) |" ;;
                *.AppImage) echo "| Any other Linux, openSUSE included | [\`$name\`]($base/$name) |" ;;
              esac
            done
            echo
            echo "SHA-256:"
            echo
            echo '```'
            cat release/SHA256SUMS.txt
            echo '```'
            echo
            if [ "$ATTESTED" = true ]; then
              echo "Check a file was built here, from this commit:"
              echo
              echo '```bash'
              echo "gh attestation verify <file> -R $GITHUB_REPOSITORY"
              echo '```'
              echo
            fi
            echo "Cores inside: Xray $XRAY_VERSION, sing-box $SING_BOX_VERSION"
            echo
            if [ "$SIGNED" = true ]; then
              echo "Free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org)"
            else
              echo "The Windows executable in this release is unsigned. Verify its SHA-256 and build attestation before running it."
            fi
            echo
            echo "[Code signing policy](https://github.com/$GITHUB_REPOSITORY/blob/main/CODE_SIGNING.md) | [Privacy policy](https://github.com/$GITHUB_REPOSITORY/blob/main/PRIVACY.md)"
          } > notes.md
          gh release create "$TAG" release/* --draft --verify-tag --title "Phi2ray $TAG" --notes-file notes.md
